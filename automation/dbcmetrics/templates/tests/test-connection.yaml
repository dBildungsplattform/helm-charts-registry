apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dbcmetrics.fullname" . }}-test-connection"
  labels:
    {{- include "dbcmetrics.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "dbcmetrics.fullname" . }}:{{ .Values.service.port }}/metrics']
  restartPolicy: Never
